version: "2"
run:
  tests: true
  allow-parallel-runners: true
linters:
  default: none
  enable:
    # Core Go analysis.
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Correctness and resource safety.
    - asasalint
    - bodyclose
    - contextcheck
    - durationcheck
    - errchkjson
    - errorlint
    - fatcontext
    - gocheckcompilerdirectives
    - makezero
    - nilerr
    - nilnesserr
    - noctx
    - reassign
    - rowserrcheck
    - sqlclosecheck
    - wastedassign

    # Security.
    - bidichk
    - gosec

    # Modern Go and performance.
    - canonicalheader
    - copyloopvar
    - exptostd
    - mirror
    - modernize
    - nosprintfhostport
    - perfsprint
    - unconvert
    - usestdlibvars

    # API and design consistency.
    - errname
    - goconst
    - goprintffuncname
    - iotamixing
    - loggercheck
    - predeclared
    - recvcheck
    - revive

    # Tests.
    - testifylint
    - thelper
    - tparallel
    - usetesting

    # Source hygiene and maintainability.
    - asciicheck
    - dogsled
    - dupword
    - godot
    - lll
    - misspell
    - nestif
    - nolintlint
  settings:
    errcheck:
      check-blank: true
    govet:
      enable:
        - atomicalign
        - deepequalerrors
        - nilness
        - reflectvaluecompare
        - sortslice
        - unusedwrite
    lll:
      line-length: 120
      tab-width: 2
    nolintlint:
      require-specific: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - vendor$
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  whole-files: true
formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
  exclusions:
    generated: lax
    paths:
      - vendor$
      - third_party$
      - builtin$
      - examples$
